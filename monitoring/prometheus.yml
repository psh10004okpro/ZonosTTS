# Prometheus 설정 파일

global:
  scrape_interval: 15s  # 기본 스크랩 간격
  evaluation_interval: 15s  # 규칙 평가 간격
  external_labels:
    monitor: 'zonos-tts-monitor'
    environment: 'production'

# Alertmanager 설정 (선택사항)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# 규칙 파일 로드 (선택사항)
# rule_files:
#   - "alert_rules.yml"

# 스크랩 설정
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Zonos TTS API 모니터링
  - job_name: 'zonos-tts-api'
    scrape_interval: 10s  # 더 자주 수집
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']  # Docker Compose 서비스 이름
        labels:
          app: 'zonos-tts'
          service: 'backend'

  # Redis 모니터링 (redis_exporter 사용 시)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         app: 'zonos-tts'
  #         service: 'redis'

  # Node Exporter (시스템 메트릭 - 선택사항)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
